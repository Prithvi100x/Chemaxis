kind = "web"
previewPath = "/"
title = "ChemAxis"
version = "1.0.0"
id = "artifacts/chemaxis"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20901

[services.development]
run = "pnpm --filter @workspace/chemaxis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chemaxis", "run", "build" ]
publicDir = "artifacts/chemaxis/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20901"
BASE_PATH = "/"
