<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#2D4A46"/>
  <!-- Top node -->
  <rect x="74" y="39" width="32" height="32" rx="5" fill="white"/>
  <!-- Bottom-left node -->
  <rect x="42" y="109" width="32" height="32" rx="5" fill="white"/>
  <!-- Bottom-right node -->
  <rect x="106" y="109" width="32" height="32" rx="5" fill="white"/>
  <!-- Vertical line from top node down to junction -->
  <line x1="90" y1="71" x2="90" y2="95" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Horizontal bar at junction -->
  <line x1="58" y1="95" x2="122" y2="95" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Left branch down to bottom-left node -->
  <line x1="58" y1="95" x2="58" y2="109" stroke="white" stroke-width="10" stroke-linecap="round"/>
  <!-- Right branch down to bottom-right node -->
  <line x1="122" y1="95" x2="122" y2="109" stroke="white" stroke-width="10" stroke-linecap="round"/>
</svg>
